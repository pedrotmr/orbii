name: Update Orbii Dev app

on:
  push:
    branches:
      - main
    paths:
      - apps/mobile/**
      - packages/tokens/**
      - packages/backend/src/**
      - packages/backend/convex/lib.ts
      - packages/backend/convex/_generated/api.*
      - packages/backend/package.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

permissions:
  contents: read

concurrency:
  group: orbii-staging-release
  cancel-in-progress: false

jobs:
  update:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changes
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            changed_files="$(git show --format= --name-only "$AFTER_SHA")"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
          fi

          mobile_changed=false
          native_changed=false

          while IFS= read -r path; do
            case "$path" in
              apps/mobile/*|packages/tokens/*|packages/backend/src/*|packages/backend/convex/lib.ts|packages/backend/convex/_generated/api.*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml)
                mobile_changed=true
                ;;
            esac

            case "$path" in
              apps/mobile/app.config.*|apps/mobile/app.json|apps/mobile/eas.json|apps/mobile/package.json|apps/mobile/plugins/*|apps/mobile/ios/*|apps/mobile/android/*|apps/mobile/assets/icon*|apps/mobile/assets/adaptive-icon*|apps/mobile/assets/android-icon-*|apps/mobile/assets/splash*|packages/tokens/package.json|packages/backend/package.json|package.json|pnpm-lock.yaml|pnpm-workspace.yaml)
                native_changed=true
                ;;
            esac
          done <<< "$changed_files"

          echo "mobile_changed=$mobile_changed" >> "$GITHUB_OUTPUT"
          echo "native_changed=$native_changed" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify project
        run: pnpm verify

      - name: Publish Orbii Dev app update
        if: ${{ steps.changes.outputs.mobile_changed == 'true' && steps.changes.outputs.native_changed == 'false' }}
        working-directory: apps/mobile
        run: pnpm dlx eas-cli@24.8.0 update --channel preview --environment preview --platform all --message "main ${GITHUB_SHA:0:7}" --non-interactive
        env:
          APP_VARIANT: preview
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
