<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbii Rewards prototype: Ready and in progress</title>
<style>
  /* Theme values copy packages/tokens/src/native.ts (lightColors, darkColors). Spacing, radius and type use its space, radius and fontSize scales. */
  .light {
    color-scheme: light;
    --bg: #F5F5F3; --bg-mid: #ECEDE9; --surface: #FEFEFC; --ink: #252923;
    --muted: #60655C; --line: #D6D9D1; --primary: #B54420; --primary-deep: #A33A18;
    --primary-soft: #FAE9DF; --success-soft: #E8EFDF; --on-primary: #FFFBF7;
    --focus: #CE5628; --track: #E3E6DE;
  }
  .dark {
    color-scheme: dark;
    --bg: #181B18; --bg-mid: #222621; --surface: #242923; --ink: #F0F2E9;
    --muted: #B1B8AB; --line: #41483D; --primary: #FFA77C; --primary-deep: #FFB48F;
    --primary-soft: #452E23; --success-soft: #303B26; --on-primary: #331D12;
    --focus: #FFA77C; --track: #373F32;
  }
  :root {
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px;
    --r-lg: 16px; --r-full: 999px;
    --fs-xs: 0.75rem; --fs-sm: 0.875rem; --fs-md: 1rem; --fs-lg: 1.125rem; --fs-2xl: 1.625rem;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #E2E4DE; color: #252923; font-family: var(--font);
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  .sheet { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: var(--s8); padding: var(--s6); }
  .device { width: 390px; max-width: 100%; }
  figcaption { margin-bottom: var(--s2); font-size: var(--fs-sm); line-height: 1.43; font-weight: 600; text-align: center; }
  svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button, summary, .tab { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  .phone {
    position: relative; display: flex; flex-direction: column; width: 100%; height: 844px;
    overflow: hidden; border-radius: 44px; background: var(--bg); color: var(--ink);
    outline: 1px solid var(--line);
  }
  .status {
    flex: none; display: flex; align-items: center; justify-content: space-between;
    height: 54px; padding-inline: 36px 30px; font-size: var(--fs-md); font-weight: 600;
  }
  .battery { width: 25px; height: 12px; border: 1.5px solid currentColor; border-radius: 4px; }
  .screen {
    flex: 1; display: flex; flex-direction: column; gap: var(--s6);
    padding: var(--s4) var(--s6) var(--s6); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none;
  }
  .screen::-webkit-scrollbar { display: none; }

  h1 { font-size: 2.125rem; line-height: 1.18; font-weight: 700; letter-spacing: -0.03em; text-wrap: balance; }
  .head { display: flex; flex-direction: column; gap: var(--s4); }
  .balance { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s2) var(--s3); }
  .points { font-size: var(--fs-2xl); line-height: 1.23; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .unit { font-size: var(--fs-md); font-weight: 600; letter-spacing: 0; color: var(--muted); }
  .caption { margin-top: var(--s1); font-size: var(--fs-sm); line-height: 1.43; color: var(--muted); text-wrap: pretty; }

  .pill {
    display: inline-flex; align-items: center; justify-content: center; gap: var(--s1);
    min-height: 44px; border: 1px solid transparent; border-radius: var(--r-full);
    font-size: var(--fs-md); font-weight: 600; white-space: nowrap;
  }
  .pill svg { width: 20px; height: 20px; stroke-width: 2.2; }
  .add { padding-inline: var(--s3) var(--s4); background: var(--primary-soft); color: var(--primary); }
  .add:active { opacity: 0.75; }
  .redeem { padding-inline: var(--s5); background: var(--primary); color: var(--on-primary); }
  .redeem:active { background: var(--primary-deep); }

  section { display: flex; flex-direction: column; gap: var(--s3); }
  h2 { font-size: var(--fs-lg); line-height: 1.33; font-weight: 700; text-wrap: balance; }
  .group { list-style: none; border-radius: var(--r-lg); background: var(--surface); }
  .group.ready { background: var(--success-soft); }
  .row { position: relative; display: flex; flex-direction: column; gap: var(--s3); padding: var(--s4); }
  .row + .row::before, .history li::before {
    content: ""; position: absolute; inset-block-start: 0; inset-inline: var(--s4) 0;
    height: 1px; background: var(--line);
  }
  .top { display: flex; align-items: flex-start; margin-block: -11px; margin-inline-end: -12px; }
  .name {
    flex: 1; min-width: 0; padding-block: 11px; padding-inline-end: var(--s2);
    font-size: var(--fs-md); line-height: 1.375; font-weight: 600; overflow-wrap: anywhere;
  }
  .icon { display: grid; place-items: center; width: 44px; height: 44px; border-radius: var(--r-full); color: var(--muted); }
  .icon svg { width: 20px; height: 20px; }
  .icon:active { background: var(--bg-mid); }
  @media (hover: hover) { .icon:hover { background: var(--bg-mid); } }
  .track { height: 6px; overflow: hidden; border-radius: var(--r-full); background: var(--track); }
  .track span { display: block; height: 100%; border-radius: inherit; background: var(--primary); }
  @media (forced-colors: active) {
    .track { border: 1px solid CanvasText; }
    .track span { forced-color-adjust: none; background: CanvasText; }
    .tab[aria-current="page"] .glyph { border: 1px solid CanvasText; }
  }
  .foot {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: var(--s2) var(--s3); font-size: var(--fs-sm); line-height: 1.43; font-variant-numeric: tabular-nums;
  }
  .cost { font-weight: 600; }
  .togo { font-weight: 500; color: var(--muted); }

  details { border-radius: var(--r-lg); background: var(--surface); }
  summary {
    display: flex; align-items: center; gap: var(--s2); min-height: 56px; padding: var(--s3) var(--s4);
    list-style: none; cursor: pointer; border-radius: var(--r-lg);
    font-size: var(--fs-md); line-height: 1.375; font-weight: 600;
  }
  summary::-webkit-details-marker { display: none; }
  summary:focus-visible { outline-offset: -2px; }
  .count { margin-inline-start: auto; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
  summary svg { width: 18px; height: 18px; color: var(--muted); }
  details[open] summary svg { transform: rotate(180deg); }
  .history { list-style: none; }
  .history li {
    position: relative; display: flex; align-items: center; gap: var(--s3);
    min-height: 64px; padding: var(--s3) var(--s4); font-size: var(--fs-sm); line-height: 1.43;
  }
  .history .what { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .history .title { font-size: var(--fs-md); line-height: 1.375; font-weight: 600; overflow-wrap: anywhere; }
  .history .when, .history .spent { color: var(--muted); }
  .history .spent { font-weight: 600; font-variant-numeric: tabular-nums; }

  .tabs {
    flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    padding: var(--s2) var(--s2) 30px; background: var(--bg); border-top: 1px solid var(--line);
  }
  .tab {
    display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 48px;
    color: var(--muted); font-size: var(--fs-xs); line-height: 1.25; font-weight: 600; text-decoration: none;
  }
  .tab .glyph { display: grid; place-items: center; width: 56px; height: 30px; border-radius: var(--r-full); }
  .tab svg { width: 22px; height: 22px; }
  .tab[aria-current="page"] { color: var(--primary); }
  .tab[aria-current="page"] .glyph { background: var(--primary-soft); }
  .home {
    position: absolute; inset-block-end: 8px; left: 50%; width: 134px; height: 5px;
    margin-left: -67px; border-radius: 3px; background: var(--ink);
  }

  @media (max-width: 430px) {
    .sheet { padding: var(--s6) 0 0; gap: var(--s6); }
    .phone { border-radius: 0; outline: 0; }
  }
</style>
</head>
